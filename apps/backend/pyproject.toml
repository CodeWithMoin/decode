[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "decode-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.38,<3", "alembic>=1.14,<2",
  "asyncpg>=0.30,<1", "psycopg[binary]>=3.2,<4", "aiosqlite>=0.21,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1", "arq>=0.26,<1", "redis>=5,<6",
  "boto3>=1.36,<2", "openai>=2.11,<3",
  "langfuse>=4.10,<5",
  "httpx>=0.28,<1",
  # Department manifests are YAML frontmatter in SKILL.md.
  "pyyaml>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML>=6,<7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI dependency markers intentionally live in defaults.

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["decode*"]
